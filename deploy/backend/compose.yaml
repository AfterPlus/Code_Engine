# Production Java backend: two containers.
#   api    Spring Boot + the child JVMs that run user code. No network at all (only loopback, which the JDWP link to
#          the children needs). It serves HTTP on a Unix socket in the shared `socket` volume.
#   proxy  Caddy. The only container with a network: terminates TLS on 443 and forwards /api/* to that socket.
# Setup and the Oracle VM steps: deploy/backend/README.md.

name: codeengine

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    image: codeengine-api
    network_mode: none
    read_only: true
    tmpfs:
      # Per-run sandbox directories (source, class files, JVM temp files) live here and vanish on restart.
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    volumes:
      - socket:/run/codeengine
    environment:
      LCV_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      LCV_SANDBOX_MAX_CONCURRENT: ${MAX_CONCURRENT:-3}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Each concurrent run is one child JVM (~1 CPU, ~300 MB, a few dozen threads) on top of the ~600 MB server.
    cpus: ${API_CPUS:-3}
    mem_limit: ${API_MEMORY:-3g}
    pids_limit: 512
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  proxy:
    image: caddy:2.10-alpine
    depends_on: [api]
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - socket:/run/codeengine
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging: *logging

volumes:
  socket:
  caddy_data:
  caddy_config:
