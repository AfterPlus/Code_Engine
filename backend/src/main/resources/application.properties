server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=2048

# During development the frontend is served straight from ../frontend (edit + refresh);
# the packaged jar falls back to the copy bundled under classpath:/static.
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
spring.web.resources.cache.period=0

# Execution sandbox limits (see SandboxPolicy / ResourceLimiter)
lcv.sandbox.max-concurrent=2
lcv.sandbox.max-queued=16
lcv.sandbox.timeout-ms=20000
lcv.sandbox.memory-mb=128
lcv.sandbox.max-steps=5000
lcv.sandbox.max-output-bytes=65536
lcv.sandbox.max-code-chars=50000
